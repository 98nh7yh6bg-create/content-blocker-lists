name: Build lists

on:
  schedule:
    # Daily, at an off-peak minute.
    - cron: "17 4 * * *"
  # Pull requests run the whole build as a dry run, without publishing.
  pull_request:
  workflow_dispatch:
    inputs:
      rollback_to:
        description: "Put an archived release live instead of building (e.g. lists-202609270417)"
        required: false
        default: ""
      force:
        description: "Publish even if the sanity checks fail"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'lists' }}
  cancel-in-progress: false

env:
  # AdGuard's Safari converter, built from source at a pinned tag and commit.
  # (The prebuilt release binary is missing its resource bundle and crashes.)
  CONVERTER_REPO: https://github.com/AdguardTeam/SafariConverterLib.git
  CONVERTER_VERSION: 4.3.0
  CONVERTER_COMMIT: 7a2e93f0afa70479cc59985f332025236c3f0c39

jobs:
  build:
    runs-on: macos-latest
    outputs:
      publish: ${{ steps.result.outputs.publish }}
    steps:
      - uses: actions/checkout@v5

      - name: Restore archived release
        if: inputs.rollback_to != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ inputs.rollback_to }}" --dir dist
          echo "PUBLISH=true" >> "$GITHUB_ENV"

      - name: Build converter
        if: inputs.rollback_to == ''
        run: |
          git clone --quiet --depth 1 --branch "v$CONVERTER_VERSION" "$CONVERTER_REPO" converter-src
          test "$(git -C converter-src rev-parse HEAD)" = "$CONVERTER_COMMIT"
          swift build --package-path converter-src -c release --product ConverterTool
          echo "CONVERTER=$(swift build --package-path converter-src -c release --show-bin-path)/ConverterTool" >> "$GITHUB_ENV"

      - name: Fetch filter lists
        if: inputs.rollback_to == ''
        run: scripts/fetch.sh

      - name: Convert
        if: inputs.rollback_to == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/build.sh

      - name: Sanity checks
        if: inputs.rollback_to == ''
        env:
          GH_TOKEN: ${{ github.token }}
          # Pull requests only report problems: upstream changes aren't theirs.
          FORCE: ${{ (inputs.force || github.event_name == 'pull_request') && '1' || '' }}
        run: python3 scripts/check.py

      - name: Dry run on pull requests
        if: github.event_name == 'pull_request'
        run: echo "PUBLISH=false" >> "$GITHUB_ENV"

      - name: Sign manifest
        if: inputs.rollback_to == '' && env.PUBLISH == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: swift scripts/sign.swift dist/manifest.json > dist/manifest.sig

      - name: Archive as a release
        if: inputs.rollback_to == '' && env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/archive.sh

      - name: Result
        id: result
        run: echo "publish=${PUBLISH:-false}" >> "$GITHUB_OUTPUT"

      # GitHub pauses scheduled workflows in public repos after 60 days
      # without a commit; this repo rarely gets any otherwise.
      - name: Keep the schedule alive
        if: always() && github.event_name == 'schedule'
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $((30 * 86400)) ]; then
            date -u +%Y-%m-%d > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "Keep the daily schedule alive"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: site
          path: |
            dist/manifest.json
            dist/manifest.sig
            dist/ads.json
            dist/privacy.json
            dist/cookies.json

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
